[project]
name = "rt-scheduling-frontend"
version = "0.0.0"
description = "Real-Time Scheduling Simulator built for my Bachelor's Thesis"
dependencies = [
    "gunicorn",
    "blinker==1.9.0",
    "click==8.2.1",
    "Flask==3.1.1",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.2",
    "Werkzeug==3.1.3"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rt_scheduling_frontend"]
